<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription des stagiaires</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    }
    .card {
      width: 100%; max-width: 460px; background: #fff; border-radius: 20px;
      padding: 36px 32px; box-shadow: 0 25px 60px rgba(0,0,0,.25);
    }
    .header { text-align: center; margin-bottom: 28px; }
    .header .icon {
      width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .header p { margin: 0; color: var(--muted); font-size: 14px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; padding: 12px 14px; font-size: 15px; border: 1.5px solid var(--border);
      border-radius: 10px; outline: none; transition: .2s;
    }
    input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99,102,241,.15); }

    .dropzone {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      border: 2px dashed var(--border); border-radius: 12px; padding: 22px; text-align: center;
      cursor: pointer; transition: .2s; color: var(--muted); font-size: 14px;
    }
    .dropzone:hover, .dropzone.drag { border-color: var(--primary); background: #f5f3ff; }
    .dropzone input { display: none; }
    .preview {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover; display: none;
      border: 3px solid var(--primary);
    }

    button {
      width: 100%; margin-top: 8px; padding: 14px; font-size: 16px; font-weight: 600; color: #fff;
      border: 0; border-radius: 12px; cursor: pointer; transition: .2s;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 8px 20px rgba(99,102,241,.4);
    }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    button:disabled { opacity: .7; cursor: not-allowed; }

    .spinner {
      display: none; width: 16px; height: 16px; margin-right: 8px; vertical-align: -2px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    button.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
    .alert.ok  { display: block; background: #dcfce7; color: #166534; }
    .alert.err { display: block; background: #fee2e2; color: #991b1b; }

    .link { display: block; margin-top: 20px; text-align: center; color: var(--primary); font-weight: 600; text-decoration: none; font-size: 14px; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <div class="icon">🎓</div>
      <h1>Inscription stagiaire</h1>
      <p>Remplissez le formulaire pour rejoindre la liste</p>
    </div>

    <form id="formInscription" novalidate>
      <div class="row">
        <div class="field">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" maxlength="100" placeholder="Alami" required>
        </div>
        <div class="field">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" maxlength="100" placeholder="Youssef" required>
        </div>
      </div>

      <div class="field">
        <label for="ville">Ville</label>
        <input type="text" id="ville" name="ville" maxlength="100" placeholder="Tanger" required>
      </div>

      <div class="field">
        <label>Photo</label>
        <label class="dropzone" id="dropzone" for="photo">
          <img id="preview" class="preview" alt="Aperçu">
          <span id="dropText">📷 Cliquez ou glissez une photo ici<br><small>JPG, PNG ou WebP — 5 Mo max</small></span>
          <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp" required>
        </label>
      </div>

      <button type="submit" id="btn"><span class="spinner"></span><span id="btnText">Inscrire</span></button>
    </form>

    <div id="message" class="alert" role="alert"></div>
    <a class="link" href="liste.html">Voir la liste des stagiaires →</a>
  </main>

  <script>
    const form = document.getElementById('formInscription');
    const btn = document.getElementById('btn');
    const btnText = document.getElementById('btnText');
    const message = document.getElementById('message');
    const photo = document.getElementById('photo');
    const preview = document.getElementById('preview');
    const dropText = document.getElementById('dropText');
    const dropzone = document.getElementById('dropzone');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'alert ' + type;
    }

    function showPreview(file) {
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      dropText.textContent = file.name;
    }

    function resetPreview() {
      preview.style.display = 'none';
      dropText.innerHTML = '📷 Cliquez ou glissez une photo ici<br><small>JPG, PNG ou WebP — 5 Mo max</small>';
    }

    photo.addEventListener('change', () => showPreview(photo.files[0]));

    ['dragover', 'dragenter'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
    dropzone.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) {
        photo.files = e.dataTransfer.files;
        showPreview(photo.files[0]);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!form.checkValidity()) {
        showMessage('Veuillez remplir tous les champs et choisir une photo.', 'err');
        return;
      }
      if (photo.files[0].size > 5 * 1024 * 1024) {
        showMessage('La photo ne doit pas dépasser 5 Mo.', 'err');
        return;
      }

      btn.disabled = true;
      btn.classList.add('loading');
      btnText.textContent = 'Envoi en cours...';
      message.className = 'alert';

      try {
        const response = await fetch('/api/inscrire.php', { method: 'POST', body: new FormData(form) });
        const data = await response.json();

        if (data.success) {
          showMessage(data.message, 'ok');
          form.reset();
          resetPreview();
        } else {
          showMessage(data.error || 'Une erreur est survenue.', 'err');
        }
      } catch (error) {
        showMessage('Erreur de connexion au serveur.', 'err');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btnText.textContent = 'Inscrire';
      }
    });
  </script>
</body>
</html>
